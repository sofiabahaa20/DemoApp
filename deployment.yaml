apiVersion: apps/v1
kind: Deployment
metadata:
  name: demoapp
  namespace: ivolve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demoapp
  template:
    metadata:
      labels:
        app: demoapp
    spec:
      nodeSelector:
        project: ivolve
      tolerations:
        - key: workload
          operator: Exists
          effect: NoSchedule
      containers:
        - name: demoapp
          image: sophiabahaaboshra/demoapp:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demoapp-svc
  namespace: ivolve
spec:
  type: NodePort
  selector:
    app: demoapp
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30088
